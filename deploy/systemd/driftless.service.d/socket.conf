# Opt in to socket activation.
#
# A drop-in rather than a second copy of the unit, so there is no duplicated
# ExecStart, User or Restart policy to drift apart from driftless.service.
#
# It has to be opt-in: `Sockets=` naming a socket that has not been enabled
# makes the service fail to start, so it cannot live in the base unit that
# everyone uses.
#
# Install to /etc/systemd/system/driftless.service.d/socket.conf

[Unit]
Requires=driftless.socket
After=driftless.socket

[Service]
Sockets=driftless.socket
