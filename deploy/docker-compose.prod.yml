# Production stack for a self-hosted Driftless install.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Three app services, not one. The two extra ones fail **silently** — nothing on
# the site reports that they are missing:
#
#   worker       mail delivery and payment-webhook retries
#   maintenance  releases stock held by abandoned checkouts, matures affiliate
#                commissions, closes orders past their refund window
#
# All three mount the same checkout, because a release is a directory swap on
# that volume and every process must see the same `current`.
#
# Restart behaviour: this is a **gap** deployment — installing an app ends by
# restarting `app`, and for those few seconds nothing answers. Put a proxy in
# front if that matters, or self-host on systemd with socket activation instead.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ['3333:3333']
    volumes: ['driftless_app:/opt/driftless']
    env_file: ['../shared/.env']
    depends_on: [postgres, redis]
    # Must exceed DRIFTLESS_DRAIN_MS (10s). Docker's default is 10s exactly,
    # which races the drain deadline and usually loses.
    stop_grace_period: 20s
    healthcheck:
      # Returns 503 when the database is unreachable or the built assets do not
      # match their manifest — the state where every route answers and every
      # page is blank.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    command: ['node', 'current/bin/console.js', 'queue:work']
    volumes: ['driftless_app:/opt/driftless']
    env_file: ['../shared/.env']
    depends_on: [app]
    # The worker drains in-flight jobs on SIGTERM; a short grace period means a
    # half-processed job is redelivered and its handler runs twice.
    stop_grace_period: 20s

  maintenance:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    # A loop rather than a cron container: one less moving part, and the sweep
    # is idempotent so a missed or repeated run is harmless.
    command: ['sh', '-c', 'while true; do node current/bin/console.js modules:maintenance || true; sleep 300; done']
    volumes: ['driftless_app:/opt/driftless']
    env_file: ['../shared/.env']
    depends_on: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: driftless
      POSTGRES_DB: driftless
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes: ['driftless_pg:/var/lib/postgresql/data']
    secrets: [db_password]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on purpose: queued jobs live only in Redis, so a restart without it
    # loses undelivered mail and pending webhook retries.
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['driftless_redis:/data']

volumes:
  driftless_app:
  driftless_pg:
  driftless_redis:

secrets:
  db_password:
    file: ../shared/db_password
